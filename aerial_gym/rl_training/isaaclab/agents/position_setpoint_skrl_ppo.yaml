seed: 42

# Models
models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: True          # tanh squish to (-1,1), fixes log_prob mismatch
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 0.0            # cap std at exp(0)=1.0; original used fixed_sigma1.0
    initial_log_std: 0.0        # matches original sigma_init val: 0  std=1.0
    network:
      - name: net
        input: STATES
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 128, 64]
        activations: elu
    output: ONE

# Rollout memory
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined

# PPO agent
agent:
  class: PPO
  rollouts: 32           # steps per rollout per env
  learning_epochs: 4
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0001   # matches original entropy_coef: 0.0001
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1   # matches original scale_value: 0.1 (was 0.01  10 too small)
  time_limit_bootstrap: True
  experiment:
    directory: "position_setpoint_isaaclab"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

# Sequential trainer
trainer:
  class: SequentialTrainer
  timesteps: 1000000     # 1M steps for convergence
  environment_info: log
